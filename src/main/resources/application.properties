spring.application.name=paymentservice
server.port=8083

# In-memory H2 by default so the app runs out of the box.
# Use --spring.profiles.active=mysql for MySQL (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:paymentservice
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# User service used to validate login tokens
userservice.base-url=${USERSERVICE_URL:http://localhost:8082}

# Order service: source of the amount to charge, and notified when a payment completes
orderservice.base-url=${ORDERSERVICE_URL:http://localhost:8084}
# Shared secret for the Order Service's /internal/** endpoints. Must match the Order Service. Never commit.
internal.api-token=${INTERNAL_API_TOKEN:}

# Payment gateway: "razorpay" or "mock" (mock generates fake links, for local development)
payment.gateway=${PAYMENT_GATEWAY:mock}
payment.currency=INR
payment.link.expiry-minutes=30
payment.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:3000/payment/callback}

# Razorpay credentials. Never commit real values; set them as environment variables.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
# Secret configured on the Razorpay dashboard webhook, used to verify X-Razorpay-Signature
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Notification Service. Leave empty to disable.
notificationservice.base-url=${NOTIFICATIONSERVICE_URL:http://localhost:8086}
